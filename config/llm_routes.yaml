# Provisional engineering ceilings, not measured latency guarantees.
# Soft deadlines normally stop exploration before these emergency ceilings.
budget_profiles:
  brief:
    soft_seconds: 3
    hard_seconds: 8
    max_round_trips: 4
    max_tool_calls: 8
    max_output_tokens: 4096
    context_input_tokens: 16000
    finalization_reserve_tokens: 512
  normal:
    soft_seconds: 8
    hard_seconds: 15
    max_round_trips: 8
    max_tool_calls: 16
    max_output_tokens: 8192
    context_input_tokens: 16000
    finalization_reserve_tokens: 1024
  substantial:
    soft_seconds: 20
    hard_seconds: 30
    max_round_trips: 12
    max_tool_calls: 24
    max_output_tokens: 16384
    context_input_tokens: 24000
    finalization_reserve_tokens: 1024
  complex:
    soft_seconds: 30
    hard_seconds: 60
    max_round_trips: 20
    max_tool_calls: 40
    max_output_tokens: 32768
    context_input_tokens: 32000
    finalization_reserve_tokens: 2048

routes:
  tutor_dialogue:
    adapter: anthropic
    model: claude-opus-5-5
    effort: medium
    thinking: adaptive
    max_tokens: 2048
    stream: false
    prompt: tutor_math@1
    budget_profile: normal
  tutor_brief:
    adapter: anthropic
    model: claude-opus-5-5
    effort: low
    thinking: adaptive
    max_tokens: 2048
    stream: false
    prompt: tutor_math@1
    budget_profile: brief
  tutor_explanation:
    adapter: anthropic
    model: claude-opus-5-5
    effort: high
    thinking: adaptive
    max_tokens: 2048
    stream: false
    prompt: tutor_math@1
    budget_profile: substantial
  error_diagnosis:
    # Reserved; no live constructor uses this route in the current slice.
    adapter: anthropic
    model: claude-opus-5-5
    effort: xhigh
    thinking: adaptive
    max_tokens: 2048
    stream: false
    budget_profile: complex
  rubric_judge:
    adapter: anthropic
    model: claude-opus-5-5
    effort: high
    thinking: adaptive
    max_tokens: 2048
    stream: false
    prompt: rubric_judge@1
    budget_profile: substantial
