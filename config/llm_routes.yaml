# Provisional engineering ceilings, not measured latency guarantees.
# Soft deadlines normally stop exploration before these emergency ceilings.
budget_profiles:
  brief:
    soft_seconds: 3
    hard_seconds: 8
    max_round_trips: 4
    max_tool_calls: 8
    max_output_tokens: 4096
    context_input_tokens: 16000
    finalization_reserve_tokens: 512
  normal:
    soft_seconds: 8
    hard_seconds: 15
    max_round_trips: 8
    max_tool_calls: 16
    max_output_tokens: 8192
    context_input_tokens: 40000
    finalization_reserve_tokens: 1024
  substantial:
    soft_seconds: 20
    hard_seconds: 30
    max_round_trips: 12
    max_tool_calls: 24
    max_output_tokens: 16384
    context_input_tokens: 48000
    finalization_reserve_tokens: 1024
  complex:
    soft_seconds: 30
    hard_seconds: 60
    max_round_trips: 20
    max_tool_calls: 40
    max_output_tokens: 32768
    context_input_tokens: 64000
    finalization_reserve_tokens: 2048

# OpenAI opt-in routes, verified offline 2026-10-27. Install .[openai].
# Both providers are registered for tutor and judge; defaults remain Anthropic.
# The named examples below are never selected automatically. See eval/README.md.
# Other model families require their own compatibility verification.
routes:
  tutor_openai:
    adapter: openai
    model: gpt-5.4-2026-03-05
    effort: low
    max_tokens: 2048
    stream: false
    prompt: tutor_math@1
    budget_profile: normal
    provider_options:
      service_tier: default
      prompt_cache_retention: in_memory
      prompt_cache_key: learnai-tutor-policy-v1
  rubric_judge_openai:
    adapter: openai
    model: gpt-5.4-2026-03-05
    effort: low
    max_tokens: 2048
    stream: false
    prompt: rubric_judge@1
    budget_profile: substantial
    provider_options:
      service_tier: default
  # OpenAI temperature (0–2) requires effort: none; omit thinking.
  # prompt_cache_retention also accepts 24h for this configured model.
  tutor_dialogue:
    adapter: anthropic
    model: claude-opus-5-5
    effort: medium
    thinking: adaptive
    max_tokens: 2048
    stream: false
    prompt: tutor_math@1
    budget_profile: normal
  tutor_brief:
    adapter: anthropic
    model: claude-opus-5-5
    effort: low
    thinking: adaptive
    max_tokens: 2048
    stream: false
    prompt: tutor_math@1
    budget_profile: brief
  tutor_explanation:
    adapter: anthropic
    model: claude-opus-5-5
    effort: high
    thinking: adaptive
    max_tokens: 2048
    stream: false
    prompt: tutor_math@1
    budget_profile: substantial
  error_diagnosis:
    # Reserved; no live constructor uses this route in the current slice.
    adapter: anthropic
    model: claude-opus-5-5
    effort: xhigh
    thinking: adaptive
    max_tokens: 2048
    stream: false
    budget_profile: complex
  rubric_judge:
    adapter: anthropic
    model: claude-opus-5-5
    effort: high
    thinking: adaptive
    max_tokens: 2048
    stream: false
    prompt: rubric_judge@1
    budget_profile: substantial

# Dated direct-API estimate only; accounting parses this separately from routing.
pricing:
  version: direct-api@2026-10-26
  date: '2026-10-26'
  retrieved_at: '2026-10-26'
  currency: USD
  unit: 1000000
  source_url: https://platform.claude.com/docs/en/about-claude/pricing
  conditions:
    service_tier: standard
    inference_geo: not_available
  rates:
    claude-opus-5-5:
      input: '4'
      output: '20'
      cache_write_5m: '5'
      cache_write_1h: '8'
      cache_read: '0.20'
