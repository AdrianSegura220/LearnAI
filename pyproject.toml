# pyproject.toml
[project]
name = "learnai"
version = "0.1.0"
requires-python = ">=3.12"
# SymPy is pinned: grading depends on its evaluation rules, which change between
# releases. Upgrade deliberately, and let the generator contract tests catch drift.
dependencies = ["sympy~=1.14.0", "pyyaml>=6.0", "anthropic~=2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pytest-cov>=5.0", "httpx2>=2.16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
